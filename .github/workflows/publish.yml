# Tag-triggered publish: both images, then the Intent Fragment the estate composes.
#
# push of a v*.*.* tag (authored by release.yml via the App token) drives:
#   publish-overleaf + publish-redis -> resolve-image-lock -> fragment
name: Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (vX.Y.Z)
        required: true
        type: string

permissions: {}

jobs:
  publish-overleaf:
    uses: JorisJonkers-dev/github-workflows/.github/workflows/container-publish.yml@16d241e44f03c5cc4696d2d0de615717a61ef3c0 # v0.36.0
    with:
      image-name: overleaf
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      platforms: linux/amd64 # sharelatex/sharelatex is published for amd64 only
    permissions:
      contents: read
      packages: write

  publish-redis:
    uses: JorisJonkers-dev/github-workflows/.github/workflows/container-publish.yml@16d241e44f03c5cc4696d2d0de615717a61ef3c0 # v0.36.0
    with:
      image-name: overleaf-redis
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      context: redis
      dockerfile: redis/Dockerfile
      platforms: linux/amd64,linux/arm64
    permissions:
      contents: read
      packages: write

  # The images lock: each pushed digest, under the alias the project file names, with the
  # user the image runs as, read from what was pushed.
  resolve-image-lock:
    needs: [publish-overleaf, publish-redis]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    outputs:
      images-lock-artifact: ${{ steps.lock.outputs.images-lock-artifact }}
      source-sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      # The commit the release was cut from, so the fragment names it however publish was started.
      - name: source-commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The shared step also reads back the software version each image ships.
      - name: lock-images
        id: lock
        uses: JorisJonkers-dev/github-workflows/actions/resolve-image-lock@16d241e44f03c5cc4696d2d0de615717a61ef3c0 # v0.36.0
        with:
          name: overleaf
          images: |
            overleaf
            overleaf-redis
          tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

  fragment:
    needs: [resolve-image-lock]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: JorisJonkers-dev/github-workflows/.github/workflows/publish-fragment.yml@16d241e44f03c5cc4696d2d0de615717a61ef3c0 # v0.36.0
    with:
      project-file: deploy/overleaf.project.yml
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      ref: ${{ needs.resolve-image-lock.outputs.source-sha }}
      validate-with: deploy/env
      images-lock-artifact: ${{ needs.resolve-image-lock.outputs.images-lock-artifact }}
    secrets:
      ESTATE_DISPATCH_APP_PRIVATE_KEY: ${{ secrets.ESTATE_DISPATCH_APP_PRIVATE_KEY }}
