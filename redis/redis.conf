# Pending document updates live here between the editor and the Mongo flush.
dir /data
# Every write is logged, so an unclean stop loses at most a second of edits.
appendonly yes
# A refused write is visible and recoverable; an OOM kill ends every editing session at once.
maxmemory 400mb
# Evicting a pending update would lose an edit silently.
maxmemory-policy noeviction
protected-mode no
